services:
  - type: web
    name: trader-mini-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trader-mini-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://trader-mini-frontend.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBAPP_URL
        value: https://trader-mini-frontend.onrender.com
      - key: TELEGRAM_FUNNEL_ENABLED
        value: "false"
      - key: TELEGRAM_FUNNEL_ALLOWED_USER_IDS
        sync: false
      - key: TELEGRAM_SOURCE_CHANNEL_ID
        sync: false
      - key: TEAM_VIP_URL
        sync: false
      - key: POCKET_OPTION_PARTNER_ID
        sync: false
      - key: POCKET_OPTION_API_TOKEN
        sync: false
      - key: POCKET_OPTION_API_BASE_URL
        value: https://affiliate.pocketoption.com/api
      - key: POCKET_OPTION_REF_RU_URL
        sync: false
      - key: POCKET_OPTION_REF_WW_URL
        sync: false
      - key: DEVSBITE_CLIENT_TOKEN
        sync: false
      - key: DEVSBITE_API_BASE_URL
        value: https://api.devsbite.com

  - type: web
    name: trader-mini-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://trader-mini-backend.onrender.com

databases:
  - name: trader-mini-db
    databaseName: trader_mini
    user: trader_mini
